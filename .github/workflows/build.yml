name: Build iOS network hooks

on:
  push:
    paths:
      - payload.zip
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import BadZipFile, ZipFile

          def find_source(data, depth=0):
              try:
                  with ZipFile(BytesIO(data)) as archive:
                      names = archive.namelist()
                      for name in names:
                          if Path(name).name == "network_hooks.c":
                              return archive.read(name)
                      if depth < 2:
                          for name in names:
                              if name.lower().endswith(".zip"):
                                  found = find_source(archive.read(name), depth + 1)
                                  if found is not None:
                                      return found
              except BadZipFile:
                  pass
              return None

          package = Path("payload.zip")
          if not package.is_file():
              raise SystemExit("Missing payload.zip at repository root")
          source = find_source(package.read_bytes())
          if source is None:
              raise SystemExit("No network_hooks.c found in payload.zip or nested ZIP")
          output = Path("build-src/network_hooks.c")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(source)
          print(f"Extracted {output} ({len(source)} bytes)")
          PY

      - name: Fetch pinned fishhook source
        run: |
          mkdir -p vendor/fishhook
          base=https://raw.githubusercontent.com/facebook/fishhook/aadc161ac3b80db07a9908851839a17ba63a9eb1
          curl -fsSLo vendor/fishhook/fishhook.c "$base/fishhook.c"
          curl -fsSLo vendor/fishhook/fishhook.h "$base/fishhook.h"
          curl -fsSLo vendor/fishhook/LICENSE "$base/LICENSE"

      - name: Build arm64 iOS dylib
        run: |
          set -eu
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -std=c11 -O2 -fvisibility=hidden -Wall -Wextra \
            -Ivendor/fishhook \
            -dynamiclib -Wl,-install_name,@rpath/NetworkHooks.dylib \
            build-src/network_hooks.c vendor/fishhook/fishhook.c \
            -lobjc \
            -o dist/NetworkHooks.dylib
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from struct import unpack_from

          path = Path("dist/NetworkHooks.dylib")
          data = bytearray(path.read_bytes())
          if data[:4] != b"\xcf\xfa\xed\xfe":
              raise SystemExit("Expected a thin 64-bit Mach-O")
          ncmds = unpack_from("<I", data, 16)[0]
          cursor = 32
          sections = {}
          for _ in range(ncmds):
              cmd, cmdsize = unpack_from("<II", data, cursor)
              if cmdsize < 8 or cursor + cmdsize > len(data):
                  raise SystemExit("Invalid Mach-O load command")
              if cmd == 0x19:
                  nsects = unpack_from("<I", data, cursor + 64)[0]
                  if 72 + nsects * 80 > cmdsize:
                      raise SystemExit("Invalid Mach-O section table")
                  for i in range(nsects):
                      pos = cursor + 72 + i * 80
                      name = bytes(data[pos:pos + 16]).split(b"\0")[0]
                      segment = bytes(data[pos + 16:pos + 32]).split(b"\0")[0]
                      size = unpack_from("<Q", data, pos + 40)[0]
                      offset = unpack_from("<I", data, pos + 48)[0]
                      if offset + size > len(data):
                          raise SystemExit("Section extends beyond file")
                      sections[(segment, name)] = (offset, size)
              cursor += cmdsize
          text_offset, text_size = sections[(b"__TEXT", b"__text")]
          hash_offset, hash_size = sections[(b"__DATA", b"exthash")]
          if hash_size != 64:
              raise SystemExit("Expected 64-byte exthash section")
          digest = sha256(data[text_offset:text_offset + text_size]).hexdigest().encode()
          data[hash_offset:hash_offset + 64] = bytes(value ^ 0x5a for value in digest)
          path.write_bytes(data)
          print("Sealed __TEXT,__text SHA-256:", digest.decode())
          PY
          codesign --force --sign - dist/NetworkHooks.dylib

      - name: Inspect and package
        run: |
          set -eu
          file dist/NetworkHooks.dylib
          xcrun otool -hv dist/NetworkHooks.dylib
          xcrun nm -gU dist/NetworkHooks.dylib | grep network_hooks_
          shasum -a 256 dist/NetworkHooks.dylib > dist/SHA256SUMS
          cp vendor/fishhook/LICENSE dist/FISHHOOK-LICENSE
          cd dist
          zip -q NetworkHooks-ios-arm64.zip NetworkHooks.dylib SHA256SUMS FISHHOOK-LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkHooks-ios-arm64
          path: dist/NetworkHooks-ios-arm64.zip
          if-no-files-found: error
